# This example mirrors all built-in defaults.
# Built-in themes: default, tokyonight, catppuccin_mocha.
theme = "default"
event_poll_timeout = 250

[features.page_scroll]
step = "75%"

# Keymaps map action names to key bindings.
# Supported modifiers: ctrl, alt, and shift (for example, "ctrl-q").
# Custom bindings merge with built-in defaults by context and action. Override only
# what you want to change; unspecified bindings remain enabled.
# Built-in Space leader sequences are not configured here.
[keymap.normal]
enter_insert_mode = "i"
close_buffer = "ctrl-w"
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
undo = "u"
redo = "ctrl-r"
page_scroll_down = "ctrl-f"
page_scroll_up = "ctrl-u"

[keymap.editor_input]
exit_insert_mode = "esc"
backspace = "backspace"
insert_newline = "enter"
move_left = "left"
move_right = "right"
move_up = "up"
move_down = "down"

[keymap.explorer]
explorer_next = "j"
explorer_previous = "k"
open_selected = "enter"
explorer_fold = "h"
explorer_unfold = "l"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
refresh_explorer = "r"
toggle_ignored_files = "shift-i"

[keymap.file_picker]
close_file_picker = "esc"
file_picker_backspace = "backspace"
open_picker_file = "enter"
file_picker_next = "down"
file_picker_previous = "up"

[keymap.theme_picker]
close_theme_picker = "esc"
apply_theme = "enter"
theme_picker_next = "down"
theme_picker_previous = "up"
