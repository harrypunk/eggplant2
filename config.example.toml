# This example mirrors all built-in defaults.
# Built-in themes: default, tokyonight, catppuccin_mocha.
theme = "default"
# External sources use an explicit provider and fallback instead:
# theme = { provider = "ghostty", path = "/absolute/path/to/ghostty-theme", fallback = "default" }
event_poll_timeout = 250
# Chord that opens the common command menu in Normal, Welcome, and Explorer.
leader = "space"

[features.page_scroll]
step = "75%"

# Keymaps map custom action names to key bindings.
# Enter, Esc, Backspace, arrows, and popup confirmation/cancellation are built-in
# common behavior and cannot be overridden here.
# Supported modifiers: ctrl, alt, and shift (for example, "ctrl-q").
# Custom bindings merge with built-in defaults by context and action. Override only
# what you want to change; unspecified bindings remain enabled.
# Leader submenu sequences remain built-in; the opening chord is configured above.
[keymap.normal]
enter_insert_mode = "i"
enter_visual_mode = "v"
enter_visual_line_mode = "shift-v"
insert_after_cursor = "a"
insert_at_line_end = "shift-a"
insert_at_first_nonblank = "shift-i"
open_line_below = "o"
open_line_above = "shift-o"
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_line_start = "0"
move_line_end = "$"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
undo = "u"
redo = "ctrl-r"
page_scroll_down = "ctrl-f"
page_scroll_up = "ctrl-u"
view_align_start = "z"
buffer_jump_start = "s"
agent_open = "ctrl-i"
next_buffer_pending = "]"
previous_buffer_pending = "["
delete_grapheme = "x"
delete_line_pending = "d"
change_line_pending = "c"
yank_line_pending = "y"
paste_after = "p"
paste_before = "shift-p"

[keymap.visual]
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
move_line_start = "0"
move_line_end = "$"
delete_selection_x = "x"
delete_selection_d = "d"
change_selection = "c"
yank_selection = "y"

[keymap.explorer]
explorer_next = "j"
explorer_previous = "k"
explorer_fold = "h"
explorer_unfold = "l"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
refresh_explorer = "r"
toggle_ignored_files = "shift-i"
explorer_help = "?"
explorer_add = "a"
explorer_delete = "d"
explorer_move = "m"
explorer_copy = "c"

[keymap.vcs]
close_vcs_page_q = "q"
vcs_next_change = "j"
vcs_previous_change = "k"
vcs_stage = "s"
vcs_unstage = "u"
vcs_stage_all = "ctrl-s"
vcs_unstage_all = "shift-u"
vcs_toggle_diff = "tab"
vcs_discard = "x"
vcs_commit_placeholder = "c"
vcs_help_placeholder = "?"
open_vcs_history = "l"
vcs_merge_start = "m"
vcs_reset_menu = "r"
vcs_branch_menu = "b"

[keymap.vcs_reset_menu]
vcs_reset_soft = "s"

[keymap.vcs_branch_menu]
vcs_branch_create = "c"
vcs_branch_switch = "s"

[keymap.vcs_commit]
vcs_commit_close = "q"
vcs_commit_discard = "ctrl-c"
vcs_commit_submit = "ctrl-s"
enter_insert_mode = "i"
insert_after_cursor = "a"
insert_at_line_end = "shift-a"
insert_at_first_nonblank = "shift-i"
open_line_below = "o"
open_line_above = "shift-o"
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_line_start = "0"
move_line_end = "$"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
delete_grapheme = "x"
delete_line_pending = "d"
change_line_pending = "c"
yank_line_pending = "y"
paste_after = "p"
paste_before = "shift-p"
undo = "u"
redo = "ctrl-r"

[keymap.vcs_commit_input]
vcs_commit_discard = "ctrl-c"
vcs_commit_submit = "ctrl-s"

[keymap.vcs_history]
close_vcs_history_q = "q"
vcs_history_next = "j"
vcs_history_previous = "k"
vcs_history_toggle_diff = "tab"
vcs_history_copy_short = "c"
vcs_history_copy_full = "shift-c"
vcs_history_load_more = "n"

[features.agent]
# Optional: omit provider to use the offline fake provider.
provider = "openai"
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# Optional durable sessions; requires the `agent-sqlite` build feature and an absolute per-user path.
# session_db = "/home/you/.eggplant/agent.db"
