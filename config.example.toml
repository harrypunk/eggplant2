# This example mirrors all built-in defaults.
# Built-in themes: default, tokyonight, catppuccin_mocha.
theme = "default"
# External sources use an explicit provider and fallback instead:
# theme = { provider = "ghostty", path = "/absolute/path/to/ghostty-theme", fallback = "default" }
event_poll_timeout = 250

[features.page_scroll]
step = "75%"

# Keymaps map action names to key bindings.
# Esc and Backspace are built-in common behavior and need no entries here.
# Supported modifiers: ctrl, alt, and shift (for example, "ctrl-q").
# Custom bindings merge with built-in defaults by context and action. Override only
# what you want to change; unspecified bindings remain enabled.
# Built-in Space leader sequences are not configured here.
[keymap.normal]
enter_insert_mode = "i"
enter_visual_mode = "v"
enter_visual_line_mode = "shift-v"
insert_after_cursor = "a"
insert_at_line_end = "shift-a"
insert_at_first_nonblank = "shift-i"
open_line_below = "o"
open_line_above = "shift-o"
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_line_start = "0"
move_line_end = "$"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
undo = "u"
redo = "ctrl-r"
page_scroll_down = "ctrl-f"
page_scroll_up = "ctrl-u"
view_align_start = "z"
buffer_jump_start = "s"
next_buffer_pending = "]"
previous_buffer_pending = "["
delete_grapheme = "x"
delete_line_pending = "d"
change_line_pending = "c"
yank_line_pending = "y"
paste_after = "p"
paste_before = "shift-p"

[keymap.editor_input]
insert_newline = "enter"
move_left = "left"
move_right = "right"
move_up = "up"
move_down = "down"

[keymap.visual]
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
move_line_start = "0"
move_line_end = "$"
delete_selection_x = "x"
delete_selection_d = "d"
change_selection = "c"
yank_selection = "y"

[keymap.explorer]
explorer_next = "j"
explorer_previous = "k"
open_selected = "enter"
explorer_fold = "h"
explorer_unfold = "l"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
refresh_explorer = "r"
toggle_ignored_files = "shift-i"
explorer_help = "?"
explorer_add = "a"
explorer_delete = "d"
explorer_move = "m"
explorer_copy = "c"

[keymap.explorer_add]
explorer_add_submit = "enter"

[keymap.explorer_delete]
explorer_delete_confirm = "y"

[keymap.file_picker]
open_picker_file = "enter"
file_picker_next = "down"
file_picker_previous = "up"

[keymap.theme_picker]
apply_theme = "enter"
theme_picker_next = "down"
theme_picker_previous = "up"

[keymap.buffer_grep]
buffer_grep_next = "down"
buffer_grep_previous = "up"
buffer_grep_accept = "enter"

[keymap.project_grep]
project_grep_next = "down"
project_grep_previous = "up"
project_grep_accept = "enter"

[keymap.vcs]
close_vcs_page_q = "q"
vcs_next_change = "j"
vcs_previous_change = "k"
open_vcs_change = "enter"
vcs_stage = "s"
vcs_unstage = "u"
vcs_stage_all = "ctrl-s"
vcs_unstage_all = "shift-u"
vcs_toggle_diff = "tab"
vcs_discard_placeholder = "x"
vcs_commit_placeholder = "c"
vcs_help_placeholder = "?"
open_vcs_history = "l"
vcs_merge_start = "m"
vcs_branch_menu = "b"

[keymap.vcs_merge]
vcs_merge_submit = "enter"
vcs_merge_next = "down"
vcs_merge_previous = "up"

[keymap.vcs_branch_menu]
vcs_branch_create = "c"
vcs_branch_switch = "s"

[keymap.vcs_branch]
vcs_branch_submit = "enter"
vcs_branch_next = "down"
vcs_branch_previous = "up"

[keymap.vcs_commit]
vcs_commit_close = "q"
vcs_commit_discard = "ctrl-c"
vcs_commit_submit = "ctrl-s"
enter_insert_mode = "i"
insert_after_cursor = "a"
insert_at_line_end = "shift-a"
insert_at_first_nonblank = "shift-i"
open_line_below = "o"
open_line_above = "shift-o"
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_line_start = "0"
move_line_end = "$"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
delete_grapheme = "x"
delete_line_pending = "d"
yank_line_pending = "y"
paste_after = "p"
paste_before = "shift-p"
undo = "u"
redo = "ctrl-r"

[keymap.vcs_commit_input]
vcs_commit_discard = "ctrl-c"
vcs_commit_submit = "ctrl-s"
insert_newline = "enter"
move_left = "left"
move_right = "right"
move_up = "up"
move_down = "down"

[keymap.vcs_history]
close_vcs_history_q = "q"
vcs_history_next = "j"
vcs_history_previous = "k"
vcs_history_toggle_diff = "tab"
open_vcs_commit_detail = "enter"
vcs_history_copy_short = "c"
vcs_history_copy_full = "shift-c"
vcs_history_load_more = "n"
