# This example mirrors all built-in defaults.
# Built-in themes: default, tokyonight, catppuccin_mocha.
theme = "default"
event_poll_timeout = 250

[features.page_scroll]
step = "75%"

# Keymaps map action names to key bindings.
# Supported modifiers: ctrl, alt, and shift (for example, "ctrl-q").
# Custom bindings merge with built-in defaults by context and action. Override only
# what you want to change; unspecified bindings remain enabled.
# Built-in Space leader sequences are not configured here.
[keymap.normal]
enter_insert_mode = "i"
enter_visual_mode = "v"
insert_after_cursor = "a"
insert_at_line_end = "shift-a"
insert_at_first_nonblank = "shift-i"
open_line_below = "o"
open_line_above = "shift-o"
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_line_start = "0"
move_line_end = "$"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
undo = "u"
redo = "ctrl-r"
page_scroll_down = "ctrl-f"
page_scroll_up = "ctrl-u"
view_align_start = "z"
delete_grapheme = "x"
delete_line_pending = "d"
change_line_pending = "c"

[keymap.editor_input]
exit_insert_mode = "esc"
backspace = "backspace"
insert_newline = "enter"
move_left = "left"
move_right = "right"
move_up = "up"
move_down = "down"

[keymap.visual]
exit_visual_mode = "esc"
move_left = "h"
move_right = "l"
move_up = "k"
move_down = "j"
move_next_word_start = "w"
move_previous_word_start = "b"
move_next_word_end = "e"
move_line_start = "0"
move_line_end = "$"
delete_selection_x = "x"
delete_selection_d = "d"
change_selection = "c"

[keymap.change]
change_cancel = "esc"

[keymap.explorer]
explorer_next = "j"
explorer_previous = "k"
open_selected = "enter"
explorer_fold = "h"
explorer_unfold = "l"
focus_left = "ctrl-h"
focus_down = "ctrl-j"
focus_up = "ctrl-k"
focus_right = "ctrl-l"
refresh_explorer = "r"
toggle_ignored_files = "shift-i"

[keymap.file_picker]
close_file_picker = "esc"
file_picker_backspace = "backspace"
open_picker_file = "enter"
file_picker_next = "down"
file_picker_previous = "up"

[keymap.theme_picker]
close_theme_picker = "esc"
apply_theme = "enter"
theme_picker_next = "down"
theme_picker_previous = "up"

[keymap.buffer_jump]
buffer_jump_cancel = "esc"
buffer_jump_backspace = "backspace"

[keymap.buffer_grep]
buffer_grep_close = "esc"
buffer_grep_backspace = "backspace"
buffer_grep_next = "down"
buffer_grep_previous = "up"
buffer_grep_accept = "enter"

[keymap.project_grep]
project_grep_close = "esc"
project_grep_backspace = "backspace"
project_grep_next = "down"
project_grep_previous = "up"
project_grep_accept = "enter"

[keymap.line_jump]
line_jump_cancel = "esc"

[keymap.view_align]
view_align_cancel = "esc"
