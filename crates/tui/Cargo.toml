[package]
name = "tui"
version.workspace = true
edition.workspace = true

[features]
# Storage adapters are selected in composition/agent.rs. Keep workflows dependent on
# SessionStore and ProviderCredentialStore, not on a concrete database implementation.
# Planned, not implemented: agent-mysql and agent-postgres adapter features.

[dependencies]
app.workspace = true
eggplant-agent.workspace = true
eggplant-agent-openai.workspace = true
eggplant-agent-storage.workspace = true
eggplant-agent-storage-seaorm = { path = "../agent-storage-seaorm" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
editor.workspace = true
helix-core = { git = "http://git.z.lan/fork/helix", rev = "079a789e8cb08ead67f19e1971a1b7438b37354b" }
helix-view = { git = "http://git.z.lan/fork/helix", rev = "079a789e8cb08ead67f19e1971a1b7438b37354b" }
grep-matcher = { git = "http://git.z.lan/fork/ripgrep", rev = "7525479a9576f1ca4c2d04339d78e47ff5ae9b05" }
grep-regex = { git = "http://git.z.lan/fork/ripgrep", rev = "7525479a9576f1ca4c2d04339d78e47ff5ae9b05" }
grep-searcher = { git = "http://git.z.lan/fork/ripgrep", rev = "7525479a9576f1ca4c2d04339d78e47ff5ae9b05" }
ignore = "0.4"
nucleo-matcher = "0.3.1"
notify = "8"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-width = "0.2"
vcs.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27"
