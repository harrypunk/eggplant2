# Eggplant's original built-in palette, expressed in Helix theme format.

keyword = { fg = "magenta", modifiers = ["bold"] }
string = { fg = "green" }
comment = { fg = "dark-gray", modifiers = ["italic"] }
"function.macro" = { fg = "light-blue" }
function = { fg = "blue" }
macro = { fg = "light-blue" }
type = { fg = "yellow" }
"constant.numeric" = { fg = "light-yellow" }
number = { fg = "light-yellow" }
boolean = { fg = "light-red" }
constant = { fg = "cyan" }
variable = {}
operator = { fg = "light-magenta" }

error = { fg = "red" }
"diff.plus" = { fg = "green" }
"diff.minus" = { fg = "red" }
"diff.delta" = { fg = "light-blue" }
"ui.background" = { bg = "black" }
"ui.text" = { fg = "white" }
"ui.text.directory" = { fg = "gray" }
"ui.vcs.branch" = { fg = "light-magenta", modifiers = ["bold"] }
"ui.linenr" = {}
"ui.menu.selected" = { modifiers = ["reversed"] }
"ui.cursorline.primary" = { bg = "#202020" }
"ui.popup" = {}
"ui.statusline.normal" = {}
"ui.statusline.insert" = {}
"ui.window" = {}
"ui.help" = { modifiers = ["bold"] }
"ui.virtual.jump-label" = { fg = "light-blue", modifiers = ["bold"] }
