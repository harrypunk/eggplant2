[package]
name = "vcs"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
gix = { version = "0.85.0", default-features = false, features = ["revision", "sha1", "tree-editor"] }
helix-vcs = { git = "http://git.z.lan/fork/helix", rev = "079a789e8cb08ead67f19e1971a1b7438b37354b", features = ["git"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt"] }
