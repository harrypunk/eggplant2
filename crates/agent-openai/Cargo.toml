[package]
name = "eggplant-agent-openai"
version.workspace = true
edition.workspace = true
description = "OpenAI-compatible streaming provider for Eggplant agent"
license = "MIT"

[dependencies]
eggplant-agent.workspace = true
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
